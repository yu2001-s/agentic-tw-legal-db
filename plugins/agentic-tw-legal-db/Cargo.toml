[workspace]
members = [
    "crates/twlaw-core",
    "crates/twlaw-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.71"
license = "MIT"
authors = ["agentic tw legal db contributors"]

[workspace.dependencies]
chrono = { version = "=0.4.38", default-features = false, features = ["clock", "serde"] }
clap = { version = "=4.4.18", features = ["derive"] }
csv = "=1.3.1"
flate2 = { version = "=1.0.35", default-features = false, features = ["rust_backend"] }
percent-encoding = "=2.3.1"
regex = "=1.10.6"
reqwest = { version = "=0.11.27", default-features = false, features = ["blocking", "json", "native-tls"] }
scraper = "=0.18.1"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
thiserror = "=1.0.63"
url = "=2.5.2"
native-tls = "=0.2.12"
indexmap = "=2.2.6"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
